name: Paper trading y escaneo insiders

# Registra el rendimiento y refresca los snapshots que lee Vercel.
on:
  schedule:
    # Cada hora de lunes a viernes. Se usa GitHub Actions porque Vercel Hobby
    # no permite cron horario; Vercel solo lee los snapshots commiteados.
    - cron: "7 * * * 1-5"
  workflow_dispatch:
    inputs:
      workspace:
        description: "Solo un workspace (momentum | insider | insider_total | insider_sp500_nasdaq). Vacio = todos."
        required: false
        default: ""

# Necesario para que el job pueda commitear el historial.
permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # La primera ejecucion descarga ~11.000 formularios 4 a 8 peticiones/segundo
    # (~25 min). A partir de ahi la cache de accessions lo deja en 2-3 min.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar tracker
        env:
          # La SEC exige un User-Agent identificable con contacto real.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'sp500swing paper-trading research danielsilvaiglesias@gmail.com' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/track.js --workspace=momentum
            node scripts/track.js --workspace=insider
            node scripts/track.js --workspace=insider_total --cacheOnly
            node scripts/track.js --workspace=insider_sp500_nasdaq --cacheOnly
          elif [ -n "${{ github.event.inputs.workspace }}" ]; then
            node scripts/track.js --workspace=${{ github.event.inputs.workspace }}
          else
            node scripts/track.js
          fi

      - name: Commitear historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --staged --quiet; then
            echo "Sin cambios en el historial."
          else
            git commit -m "chore: hourly insider scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
